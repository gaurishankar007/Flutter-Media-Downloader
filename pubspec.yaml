name: media_tool
description: "Download and convert videos, audio and photos from YouTube, Facebook, Instagram, Threads, X and TikTok"
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.14.0

dependencies:
  auto_route: ^11.2.0
  dio: ^5.11.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  equatable: ^3.0.0
  file_picker: ^13.4.1
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.4
  flutter_image_compress: ^2.5.1
  flutter_sliding_toast: ^1.8.0
  gal: ^3.0.1
  get_it: ^9.3.0
  hooks_riverpod: ^3.5.0
  html: ^0.15.7
  injectable: ^3.0.0
  intl: ^0.20.3
  material_symbols_icons: ^4.2960.0
  material_ui: ^1.1.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  share_plus: ^13.3.1
  uuid: ^4.6.0
  video_player: ^2.14.1

dev_dependencies:
  auto_route_generator: ^10.6.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  injectable_generator: ^3.1.3
  leancode_lint: ^28.0.0
  pigeon: ^30.0.4

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-ExtraBold.ttf
          weight: 800

# Run `dart run flutter_launcher_icons` after changing anything in assets/icon/.
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  adaptive_icon_background: assets/icon/app_icon_background.png
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/icon/app_icon_monochrome.png
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: assets/icon/app_icon_macos.png

# Run `dart run flutter_native_splash:create` after changing the splash images or colours.
# Colours match the app's light/dark `background` tokens.
flutter_native_splash:
  color: '#F7F7FB'
  color_dark: '#0B0B12'
  image: assets/icon/splash.png
  android_12:
    image: assets/icon/splash_android12.png
    color: '#F7F7FB'
    color_dark: '#0B0B12'
  web: false
