include: package:leancode_lint/analysis_options.yaml

linter:
  rules:
    always_use_package_imports: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    unnecessary_const: true
    sort_constructors_first: true
    avoid_void_async: true
    always_put_control_body_on_new_line: true
    prefer_single_quotes: true
    unnecessary_lambdas: true
    use_declaring_parameters: true
    unnecessary_primary_constructor_body: true
    use_null_aware_elements: true
    future_sync_value: true
    # Classes with no constructor would get a noise `()` header.
    use_primary_constructors: false

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - macos/**
    - lib/**/*.g.dart
    - lib/**/*.gr.dart
    - lib/**/*.config.dart
    # Pigeon inputs keep classic syntax (see CLAUDE.md).
    - lib/config/pigeon/**
